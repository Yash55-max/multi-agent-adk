<!DOCTYPE html>
<html>
<head>
    <title>AI Terminal</title>

    <style>
        body {
            background: black;
            color: #00ff88;
            font-family: "Courier New", monospace;
            margin: 0;
        }

        .terminal-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .terminal-header {
            background: #020202;
            border-bottom: 1px solid #00ff88;
            padding: 10px;
            font-weight: bold;
            text-align: center;
        }

        .terminal {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .line {
            margin: 6px 0;
            white-space: pre-wrap;
        }

        .user { color: #00ff88; }
        .bot { color: #00ffaa; }

        .trace {
            color: #008f5a;
            font-size: 13px;
            margin-left: 10px;
        }

        .input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid #00ff88;
            padding: 10px;
        }

        .prompt { margin-right: 8px; }

        input {
            background: black;
            border: none;
            color: #00ff88;
            outline: none;
            flex: 1;
            font-family: inherit;
            font-size: 16px;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            background: #00ff88;
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>

<body>

<div class="terminal-wrapper">

    <div class="terminal-header">
        ⚡ Multi-Agent AI System Terminal
    </div>

    <div id="terminal" class="terminal"></div>

    <div class="input-line">
        <span class="prompt">➜</span>
        <input id="query" autofocus />
        <span class="cursor"></span>
    </div>

</div>

<script>
function addLine(text, type) {
    const terminal = document.getElementById("terminal");

    const div = document.createElement("div");
    div.className = "line " + type;
    div.textContent = text;

    terminal.appendChild(div);
}

async function send() {
    const input = document.getElementById("query");
    const terminal = document.getElementById("terminal");

    const text = input.value.trim();
    if (!text) return;

    addLine("➜ " + text, "user");
    input.value = "";

    const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: text })
    });

    const data = await res.json();
    const resData = data.response;

    addLine("Agents → " + resData.decision, "bot");

    resData.actions.forEach(a => {
        addLine(a, "bot");
    });

    if (resData.trace) {
        resData.trace.forEach(step => {
            addLine(`↳ ${step.agent}: ${step.reason}`, "trace");
        });
    }

    terminal.scrollTop = terminal.scrollHeight;
}

// ENTER KEY
document.getElementById("query").addEventListener("keypress", function(e) {
    if (e.key === "Enter") send();
});

// 🔥 STARTUP GREETING
window.onload = () => {
    addLine("⚡ Multi-Agent System Initialized...", "bot");
    addLine("🤖 Welcome. I can manage tasks, meetings, and memory.", "bot");
    addLine("💡 Try:", "bot");
    addLine("   • add task gym today", "bot");
    addLine("   • schedule meeting tomorrow", "bot");
    addLine("   • show tasks today", "bot");
};
</script>

</body>
</html>
